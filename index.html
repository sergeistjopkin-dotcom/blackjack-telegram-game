<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>♠ Blackjack 21 Online</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0}
body{background:#0b3318;font-family:Georgia,serif;color:#fff;height:100dvh;width:100vw}
.screen{display:none;height:100dvh;width:100vw;flex-direction:column;position:absolute;top:0;left:0}
.screen.active{display:flex}

/* Вернём твои стили */
#ss{background:radial-gradient(ellipse at 50% 25%,#1e7a38 0%,#0b3318 65%);align-items:center;justify-content:center;padding:20px;gap:18px;overflow-y:auto}
.logo h1{font-size:2.1rem;color:#d4af37;letter-spacing:4px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.logo p{font-size:.7rem;letter-spacing:3px;color:rgba(255,255,255,.4);text-align:center;margin-top:4px}
.box{background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:#d4af37;margin-bottom:7px}
.btn-go{padding:15px;background:linear-gradient(135deg,#b8891e,#e8c93a);color:#000;border:none;border-radius:12px;font-size:1rem;font-weight:bold;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(212,175,55,.3);width:100%;transition:all .15s}
.btn-go:active{transform:scale(.97)}
.ni{display:block;width:100%;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:.9rem;margin-bottom:7px;outline:none;font-family:Georgia,serif}
.ni:focus{border-color:#d4af37}
.ni::placeholder{color:rgba(255,255,255,.3)}

/* Статус подключения */
#status{position:fixed;top:0;left:0;right:0;z-index:1000;padding:4px;text-align:center;font-size:.65rem;background:rgba(0,0,0,.9);color:#fff;letter-spacing:1px}
#status.online{background:#27ae60}
#status.offline{background:#e74c3c}

/* Комната */
.room-info{text-align:center;padding:10px;margin:10px 0;background:rgba(0,0,0,.3);border-radius:10px}
.room-id{font-size:1.5rem;color:#d4af37;font-weight:bold;letter-spacing:3px}
.room-hint{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:5px}

/* Игроки в комнате */
.players-list{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.player-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.05);border-radius:8px;font-size:.8rem}
.player-item .status-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:8px}

/* Кнопка поделиться */
.btn-share{padding:8px 15px;background:rgba(33,150,243,.2);color:#2196f3;border:1px solid #2196f3;border-radius:8px;font-size:.75rem;cursor:pointer;letter-spacing:1px}
</style>
</head>
<body>

<!-- Статус подключения -->
<div id="status" class="offline">🔴 Подключение...</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="ss" class="screen active">
  <div class="logo"><h1>♠ BLACKJACK 21 ♠</h1><p>ONLINE CASINO</p></div>
  <div class="box" id="mainBox">
    <div id="authSection">
      <div class="lbl">ВАШЕ ИМЯ</div>
      <input id="playerName" class="ni" placeholder="Введите имя" maxlength="15">
      <button class="btn-go" onclick="startOnlineGame()">🎰 ИГРАТЬ ОНЛАЙН</button>
    </div>
    <div id="roomSection" style="display:none;">
      <div class="room-info">
        <div style="font-size:.7rem;color:rgba(255,255,255,.5);">КОД КОМНАТЫ</div>
        <div class="room-id" id="roomIdDisplay">-----</div>
        <div class="room-hint">Поделитесь кодом с друзьями</div>
      </div>
      <div class="lbl">ИГРОКИ В КОМНАТЕ</div>
      <div class="players-list" id="playersList"></div>
      <button class="btn-share" onclick="shareRoom()">📤 ПОДЕЛИТЬСЯ КОМНАТОЙ</button>
      <button class="btn-go" onclick="startGameSession()" style="margin-top:10px;">🃏 НАЧАТЬ ИГРУ</button>
    </div>
  </div>
</div>

<!-- Отладочная информация -->
<div id="debug" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);color:#0f0;font-size:9px;padding:3px;text-align:center;z-index:999;font-family:monospace;"></div>

<script>
// ============================================
// КОНФИГУРАЦИЯ
// ============================================
const SERVER_URL = 'https://blackjack-server-x391.onrender.com'; // ТВОЙ URL

// ============================================
// ЗАЩИТА ОТ БОТОВ
// ============================================
function verifyTelegramUser() {
    const debug = document.getElementById('debug');
    
    if (!window.Telegram || !window.Telegram.WebApp) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0b3318;color:white;text-align:center;font-family:Georgia,serif;padding:20px;">
                <div>
                    <h1 style="color:#d4af37;">🔒 ОТКРОЙТЕ В TELEGRAM</h1>
                    <p style="margin-top:10px;">Эта игра работает только через Telegram Mini App</p>
                    <p style="color:rgba(255,255,255,.5);font-size:.8rem;margin-top:10px;">@Blackjack21Bot</p>
                </div>
            </div>`;
        return false;
    }
    
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
        document.body.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0b3318;color:white;text-align:center;font-family:Georgia,serif;padding:20px;">
                <div>
                    <h1 style="color:#d4af37;">🔒 ВЕРИФИКАЦИЯ</h1>
                    <p style="margin-top:10px;">Не удалось подтвердить личность</p>
                    <button onclick="window.Telegram.WebApp.close()" style="padding:10px 20px;background:#d4af37;color:black;border:none;border-radius:8px;margin-top:15px;cursor:pointer;">ЗАКРЫТЬ</button>
                </div>
            </div>`;
        return false;
    }
    
    window.telegramUser = {
        id: tg.initDataUnsafe.user.id.toString(),
        username: tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || 'Player',
        firstName: tg.initDataUnsafe.user.first_name || 'Guest',
    };
    
    debug.textContent = '✅ Telegram: ' + window.telegramUser.username;
    return true;
}

// ============================================
// WebSocket ПОДКЛЮЧЕНИЕ
// ============================================
let ws = null;
let myPlayerId = null;
let currentRoom = null;
let isConnected = false;

function connectToServer() {
    const debug = document.getElementById('debug');
    const status = document.getElementById('status');
    
    if (!verifyTelegramUser()) return;
    
    debug.textContent = '🔄 Подключение к серверу...';
    
    ws = new WebSocket(SERVER_URL);
    
    ws.onopen = () => {
        isConnected = true;
        status.textContent = '🟢 ОНЛАЙН';
        status.className = 'online';
        debug.textContent = '✅ Подключено к серверу';
        
        // Авторизация
        ws.send(JSON.stringify({
            type: 'auth',
            telegramId: window.telegramUser.id,
            username: window.telegramUser.username,
        }));
        
        // Пинг каждые 30 секунд
        setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);
    };
    
    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        debug.textContent = '📨 ' + msg.type;
        handleMessage(msg);
    };
    
    ws.onclose = () => {
        isConnected = false;
        status.textContent = '🔴 ОФЛАЙН — Переподключение...';
        status.className = 'offline';
        debug.textContent = '❌ Соединение потеряно';
        
        setTimeout(connectToServer, 5000);
    };
    
    ws.onerror = (err) => {
        debug.textContent = '❌ Ошибка подключения';
        console.error('WebSocket error:', err);
    };
}

// ============================================
// ОБРАБОТКА СООБЩЕНИЙ
// ============================================
function handleMessage(msg) {
    switch (msg.type) {
        case 'auth_ok':
            myPlayerId = msg.playerId;
            document.getElementById('playerName').value = msg.username || '';
            document.getElementById('debug').textContent = '✅ Авторизован: ' + msg.username + ' | Баланс: ' + msg.balance;
            break;
        
        case 'room_created':
            currentRoom = msg.roomId;
            showRoomScreen(msg.roomId);
            break;
        
        case 'room_joined':
            currentRoom = msg.roomId;
            showRoomScreen(msg.roomId);
            updatePlayersList(msg.players);
            break;
        
        case 'player_joined':
            document.getElementById('debug').textContent = '👤 ' + msg.username + ' присоединился';
            // Обновить список игроков
            break;
        
        case 'pong':
            // Сервер жив
            break;
        
        case 'error':
            alert('❌ ' + msg.message);
            break;
        
        default:
            console.log('Неизвестное сообщение:', msg);
    }
}

// ============================================
// ИГРОВЫЕ ФУНКЦИИ
// ============================================
function startOnlineGame() {
    if (!isConnected) {
        alert('⚠️ Нет подключения к серверу. Подождите...');
        return;
    }
    
    const name = document.getElementById('playerName').value.trim();
    if (!name) {
        alert('Введите ваше имя!');
        return;
    }
    
    // Проверка на ботов: небольшая задержка
    setTimeout(() => {
        const roomId = getRoomFromURL() || ('ROOM' + Math.random().toString(36).substring(2, 6).toUpperCase());
        
        ws.send(JSON.stringify({
            type: 'create_room',
            roomId: roomId,
            username: name,
        }));
    }, 500);
}

function getRoomFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('room');
}

function showRoomScreen(roomId) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('roomSection').style.display = 'block';
    document.getElementById('roomIdDisplay').textContent = roomId;
    document.getElementById('debug').textContent = '🏠 Комната: ' + roomId;
}

function updatePlayersList(players) {
    const list = document.getElementById('playersList');
    list.innerHTML = players.map(p => `
        <div class="player-item">
            <span><span class="status-dot"></span> ${p.username}</span>
            <span style="color:rgba(255,255,255,.5);font-size:.7rem;">ID: ${p.id.slice(0,6)}</span>
        </div>
    `).join('');
}

function shareRoom() {
    if (!currentRoom) return;
    
    const shareText = encodeURIComponent(
        '🎰 Играю в Блэкджек 21!\n' +
        'Код комнаты: ' + currentRoom + '\n' +
        'Присоединяйся: https://t.me/@Gem_analitics_bot?start=' + currentRoom
    );
    
    const shareURL = 'https://t.me/share/url?url=https://t.me/@Gem_analitics_bot&text=' + shareText;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.openTelegramLink(shareURL);
    } else {
        // Копируем код комнаты
        navigator.clipboard.writeText(currentRoom).then(() => {
            alert('📋 Код комнаты скопирован: ' + currentRoom + '\nОтправьте его друзьям!');
        });
    }
}

function startGameSession() {
    ws.send(JSON.stringify({
        type: 'start_game',
        roomId: currentRoom,
    }));
    
    document.getElementById('debug').textContent = '🃏 Игра начинается...';
}

// ============================================
// ЗАПУСК
// ============================================
window.addEventListener('DOMContentLoaded', () => {
    connectToServer();
    
    // Если есть код комнаты в URL — авто-подключение
    const roomFromURL = getRoomFromURL();
    if (roomFromURL) {
        document.getElementById('debug').textContent = '🔗 Присоединение к комнате: ' + roomFromURL;
    }
});

// Анти-бот таймер
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        // Пользователь ушёл — подозрительно
        console.log('⚠️ User left the app');
    }
});
</script>
</body>
</html>
