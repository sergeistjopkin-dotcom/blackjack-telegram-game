<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>♠ Blackjack 21</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0}
body{background:#0b3318;font-family:Georgia,serif;color:#fff;height:100dvh;width:100vw}
.screen{display:none;height:100dvh;width:100vw;flex-direction:column;position:absolute;top:0;left:0}
.screen.active{display:flex}

/* Статус бар */
#status-bar{position:fixed;top:0;left:0;right:0;z-index:9999;padding:4px;text-align:center;font-size:.6rem;letter-spacing:1px;background:rgba(0,0,0,.9)}
#status-bar.online{background:#27ae60}#status-bar.offline{background:#e74c3c}#status-bar.connecting{background:#f39c12}

/* Главный экран */
#home-screen{background:radial-gradient(ellipse at 50% 25%,#1e7a38 0%,#0b3318 65%);align-items:center;justify-content:center;padding:20px;gap:18px}
.logo{text-align:center}
.logo h1{font-size:2rem;color:#d4af37;letter-spacing:4px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.logo .sub{font-size:.65rem;letter-spacing:3px;color:rgba(255,255,255,.4)}
.card-box{background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.2);border-radius:16px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:#d4af37;margin-bottom:4px}
.inp{display:block;width:100%;padding:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:.9rem;outline:none;font-family:Georgia,serif;text-align:center}
.inp:focus{border-color:#d4af37}
.inp::placeholder{color:rgba(255,255,255,.3)}
.btn-gold{padding:14px;background:linear-gradient(135deg,#b8891e,#e8c93a);color:#000;border:none;border-radius:12px;font-size:.95rem;font-weight:bold;cursor:pointer;letter-spacing:2px;width:100%;box-shadow:0 4px 20px rgba(212,175,55,.3);transition:all .15s;font-family:Georgia,serif}
.btn-gold:active{transform:scale(.97)}.btn-gold:disabled{opacity:.4}

/* Квиз */
#quiz-screen{background:radial-gradient(ellipse at 50% 25%,#1e7a38 0%,#0b3318 65%);align-items:center;justify-content:center;padding:20px}
.quiz-card{background:rgba(0,0,0,.4);border:2px solid #d4af37;border-radius:16px;padding:25px;width:100%;max-width:380px;text-align:center}
.quiz-q{font-size:1.1rem;color:#d4af37;margin-bottom:20px;line-height:1.4}
.quiz-answers{display:flex;flex-direction:column;gap:10px}
.quiz-btn{padding:12px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:.9rem;cursor:pointer;font-family:Georgia,serif;text-align:center}
.quiz-btn.correct{background:#27ae60!important;border-color:#27ae60!important}
.quiz-btn.wrong{background:#e74c3c!important;border-color:#e74c3c!important}
.quiz-progress{font-size:.65rem;color:rgba(255,255,255,.4);margin-bottom:10px;letter-spacing:2px}

/* Комната */
.room-box{text-align:center;padding:12px;background:rgba(0,0,0,.3);border-radius:12px}
.room-code{font-size:2rem;color:#d4af37;font-weight:bold;letter-spacing:4px}
.room-players{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.player-tag{background:rgba(212,175,55,.15);color:#d4af37;padding:5px 12px;border-radius:15px;font-size:.75rem;border:1px solid rgba(212,175,55,.3)}
.waiting-text{color:rgba(255,255,255,.5);font-size:.7rem;font-style:italic}
.btn-share{padding:10px;background:rgba(33,150,243,.15);color:#2196f3;border:1px solid #2196f3;border-radius:8px;font-size:.8rem;cursor:pointer;width:100%;font-family:Georgia,serif}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.9);color:#fff;padding:12px 25px;border-radius:25px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="status-bar" class="connecting">🟡 ПОДКЛЮЧЕНИЕ...</div>
<div class="toast" id="toast"></div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="home-screen" class="screen active">
  <div class="logo">
    <h1>♠ BLACKJACK 21 ♠</h1>
    <div class="sub">ONLINE CASINO • TELEGRAM</div>
  </div>
  <div class="card-box" id="homeContent">
    <div class="lbl">👤 ВАШЕ ИМЯ</div>
    <input id="playerName" class="inp" placeholder="Введите имя" maxlength="12">
    <div class="lbl">🏠 КОД КОМНАТЫ</div>
    <input id="roomCode" class="inp" placeholder="Пусто = новая комната" maxlength="10" style="text-transform:uppercase">
    <div style="font-size:.6rem;color:rgba(255,255,255,.3);text-align:center">Оставьте пустым или введите код друга</div>
    <button class="btn-gold" id="btnPlay" onclick="joinGame()">🎰 ИГРАТЬ</button>
    <div id="roomInfo" style="display:none;">
      <div class="room-box">
        <div style="font-size:.6rem;color:rgba(255,255,255,.4)">КОД КОМНАТЫ</div>
        <div class="room-code" id="roomIdDisplay">-----</div>
        <div class="room-players" id="playersList"></div>
        <div class="waiting-text">Ожидание игроков...</div>
      </div>
      <button class="btn-share" onclick="shareRoom()">📤 ПРИГЛАСИТЬ ДРУЗЕЙ</button>
    </div>
  </div>
</div>

<!-- КВИЗ ЭКРАН -->
<div id="quiz-screen" class="screen">
  <div class="quiz-card">
    <div style="font-size:1.5rem;color:#d4af37;margin-bottom:10px;">🛡️ ПРОВЕРКА</div>
    <div style="font-size:.65rem;color:rgba(255,255,255,.4);margin-bottom:15px;">ПОДТВЕРДИТЕ ЧТО ВЫ ЧЕЛОВЕК</div>
    <div class="quiz-progress" id="quizProgress">ВОПРОС 1 ИЗ 3</div>
    <div class="quiz-q" id="quizQuestion"></div>
    <div class="quiz-answers" id="quizAnswers"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// КОНФИГУРАЦИЯ
// ═══════════════════════════════════════
const SERVER_URL = 'wss://blackjack-server-x391.onrender.com';

// ═══════════════════════════════════════
// КВИЗ
// ═══════════════════════════════════════
const quizQuestions = [
    {q:'🎯 Сколько очков нужно в Блэкджеке?',a:['21','20','18','22'],c:0},
    {q:'🃏 Какая карта = 1 или 11 очков?',a:['Король','Туз','Дама','Валет'],c:1},
    {q:'💰 Удвоение ставки называется?',a:['Сплит','Страховка','Double Down','Surrender'],c:2}
];
let qi=0,qok=0;

function showQuiz(){
  document.getElementById('home-screen').classList.remove('active');
  document.getElementById('quiz-screen').classList.add('active');
  qi=0;qok=0;loadQ();
}
function loadQ(){
  if(qi>=quizQuestions.length){quizDone();return;}
  const q=quizQuestions[qi];
  document.getElementById('quizProgress').textContent=`ВОПРОС ${qi+1} ИЗ 3`;
  document.getElementById('quizQuestion').textContent=q.q;
  document.getElementById('quizAnswers').innerHTML=q.a.map((a,i)=>`<button class="quiz-btn" onclick="answer(${i})">${a}</button>`).join('');
}
function answer(n){
  const q=quizQuestions[qi];
  const btns=document.querySelectorAll('.quiz-btn');
  btns.forEach(b=>b.style.pointerEvents='none');
  btns[q.c].classList.add('correct');
  if(n===q.c)qok++;else btns[n].classList.add('wrong');
  setTimeout(()=>{qi++;loadQ();},700);
}
function quizDone(){
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('home-screen').classList.add('active');
  document.getElementById('homeContent').style.display='flex';
  document.getElementById('playerName').value=window.tgUser?.firstName||'';
  toast(qok>=2?'✅ ПРОВЕРКА ПРОЙДЕНА':'❌ ПОПРОБУЙТЕ ЕЩЁ РАЗ');
  if(qok<2){setTimeout(()=>{qi=0;qok=0;showQuiz();},1500);}
}

// ═══════════════════════════════════════
// TELEGRAM
// ═══════════════════════════════════════
function checkTG(){
  if(!window.Telegram?.WebApp){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0b3318;color:white;text-align:center;padding:20px"><div><h1 style="color:#d4af37">🔒 TELEGRAM ONLY</h1><p>Откройте через Telegram Mini App</p></div></div>';return false;}
  const tg=window.Telegram.WebApp;tg.ready();tg.expand();
  if(!tg.initDataUnsafe?.user){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0b3318;color:white;text-align:center;padding:20px"><div><h1 style="color:#d4af37">🔒 ВЕРИФИКАЦИЯ</h1><p>Не удалось подтвердить</p><button onclick="window.Telegram.WebApp.close()" style="padding:10px 20px;background:#d4af37;color:black;border:none;border-radius:8px;margin-top:10px;cursor:pointer">ЗАКРЫТЬ</button></div></div>';return false;}
  window.tgUser={id:tg.initDataUnsafe.user.id.toString(),username:tg.initDataUnsafe.user.username||tg.initDataUnsafe.user.first_name||'Player',firstName:tg.initDataUnsafe.user.first_name||'Guest'};
  return true;
}

// ═══════════════════════════════════════
// WEBSOCKET
// ═══════════════════════════════════════
let ws=null,myId=null,room=null;

function connect(){
  const s=document.getElementById('status-bar');
  s.textContent='🟡 ПОДКЛЮЧЕНИЕ...';s.className='connecting';
  ws=new WebSocket(SERVER_URL);
  ws.onopen=()=>{
    s.textContent='🟢 СЕРВЕР ОНЛАЙН';s.className='online';
    ws.send(JSON.stringify({type:'auth',telegramId:window.tgUser?.id||'guest_'+Date.now(),username:window.tgUser?.username||'Player'}));
  };
  ws.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    switch(m.type){
      case'auth_ok':myId=m.playerId;document.getElementById('playerName').value=m.username||'';break;
      case'room_created':room=m.roomId;showRoom(m);break;
      case'room_joined':room=m.roomId;showRoom(m);break;
      case'player_joined':toast('👤 '+m.username+' присоединился!');updatePlayers(m.players);break;
      case'player_left':toast('👋 Игрок вышел');if(m.players)updatePlayers(m.players);break;
      case'error':toast('❌ '+m.message);break;
    }
  };
  ws.onclose=()=>{s.textContent='🔴 ПЕРЕПОДКЛЮЧЕНИЕ...';s.className='offline';setTimeout(connect,3000);};
  ws.onerror=()=>{s.textContent='🔴 ОШИБКА';s.className='offline';};
}

// ═══════════════════════════════════════
// ИГРА
// ═══════════════════════════════════════
function joinGame(){
  const name=document.getElementById('playerName').value.trim();
  if(!name){toast('⚠️ Введите имя!');return;}
  const rc=document.getElementById('roomCode').value.trim().toUpperCase();
  if(!ws||ws.readyState!==WebSocket.OPEN){toast('⚠️ Нет подключения к серверу');return;}
  if(rc){ws.send(JSON.stringify({type:'join_room',roomId:rc,username:name}));}
  else{const nr='R'+Math.random().toString(36).substring(2,6).toUpperCase();ws.send(JSON.stringify({type:'create_room',roomId:nr,username:name}));}
  document.getElementById('btnPlay').style.display='none';
}

function showRoom(m){
  document.getElementById('roomInfo').style.display='block';
  document.getElementById('roomIdDisplay').textContent=m.roomId;
  if(m.players)updatePlayers(m.players);
}
function updatePlayers(pl){
  document.getElementById('playersList').innerHTML=pl.map(p=>`<span class="player-tag">${p.username}</span>`).join('');
}
function shareRoom(){
  const t=encodeURIComponent('🎰 Играю в Блэкджек 21!\n🏠 Код: '+room+'\n▶️ Присоединяйся!');
  if(window.Telegram?.WebApp)window.Telegram.WebApp.openTelegramLink('https://t.me/share/url?url=&text='+t);
  else{navigator.clipboard.writeText(room);toast('📋 Код скопирован: '+room);}
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2000);}

// ═══════════════════════════════════════
// СТАРТ
// ═══════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{if(checkTG()){showQuiz();connect();}});
</script>
</body>
</html>
